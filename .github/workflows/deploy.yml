name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build --base-href /GangaClothes/

      - name: Prepare Pages Artifact
        run: |
          # Encuentra la carpeta que contiene el index.html generado por Angular
          BUILD_DIR=$(dirname $(find dist -name "index.html" | head -n 1))
          echo "Directorio detectado: $BUILD_DIR"
          
          # Crea el 404.html para rutas SPA
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
          
          # Prepara una carpeta limpia para Pages
          mkdir -p ../public_pages
          cp -r "$BUILD_DIR"/* ../public_pages/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_pages
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
